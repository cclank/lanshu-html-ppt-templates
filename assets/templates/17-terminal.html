<style>
/* ═══════════════ 终端即演示 · Terminal Deck ═══════════════ */
:root{
  --desk:#E6E3DD;--desk2:#D9D5CD;--ink:#1D1F24;--cap:#7A766E;
  --bg:#15171C;--bar:#1C1F26;--fg:#DCDFE4;--mu:#7D8590;--dim:#4E5562;
  --bl:#7AA2F7;--mt:#7FD1AE;--am:#F0B35A;--ro:#F07A7A;
  --mono:"JetBrains Mono","Noto Sans SC","PingFang SC","Microsoft YaHei",ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse 80% 70% at 50% 35%,#F0EEE9,var(--desk2));font-family:var(--mono);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1))}

/* 窗口 */
.win{position:absolute;left:90px;top:54px;width:1740px;height:944px;border-radius:16px;background:var(--bg);overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.05),0 50px 120px -30px rgba(30,25,15,.55),0 18px 40px -20px rgba(30,25,15,.35);
  transition:opacity .9s cubic-bezier(.4,0,.2,1),scale .9s cubic-bezier(.4,0,.2,1),filter .9s;transform-origin:50% 60%}
.bar{position:relative;display:flex;align-items:center;height:48px;padding:0 20px;background:var(--bar);border-bottom:1px solid rgba(255,255,255,.05)}
.dots{display:flex;gap:9px}
.dots i{width:13px;height:13px;border-radius:50%;background:#FF5F57}.dots i:nth-child(2){background:#FEBC2E}.dots i:nth-child(3){background:#28C840}
.ttl{position:absolute;left:0;right:0;text-align:center;font-size:15px;color:#8A919C;letter-spacing:.02em;pointer-events:none}
.tab{margin-left:auto;padding:5px 12px;border-radius:7px;background:rgba(255,255,255,.05);font-size:14px;color:#8A919C}
.scr{position:absolute;left:0;right:0;top:48px;bottom:0;padding:24px 40px;font-size:28px;line-height:1.32;color:var(--fg);white-space:pre;overflow:hidden}
.ln{height:1.32em}
.scr i{font-style:normal}
.w{display:inline-block;width:2ch;text-align:center}
.n{display:inline-block;width:1ch;text-align:center}
.fade-out{opacity:0;transition:opacity .16s}
.k,.bx{display:inline-block;width:1ch;height:1.32em;vertical-align:top}
.k{background:linear-gradient(currentColor,currentColor) 0 var(--ky,50%)/var(--kw,100%) var(--kh,100%) no-repeat}
.ks{opacity:.35}
.thin{--kh:56%}
.bx{background:var(--L,none),var(--R,none),var(--U,none),var(--D,none)}
.aL{--L:linear-gradient(currentColor,currentColor) 0 50%/50% 2px no-repeat}
.aR{--R:linear-gradient(currentColor,currentColor) 100% 50%/50% 2px no-repeat}
.aU{--U:linear-gradient(currentColor,currentColor) 50% 0/2px 50% no-repeat}
.aD{--D:linear-gradient(currentColor,currentColor) 50% 100%/2px 50% no-repeat}

/* 语义色 */
.c-mu{color:var(--mu)}.c-dim{color:var(--dim)}.c-bl{color:var(--bl)}.c-mt{color:var(--mt)}.c-am{color:var(--am)}.c-ro{color:var(--ro)}.c-fg{color:var(--fg)}
.b{font-weight:700}.it{font-style:italic}
.c-cm{color:#6C7482;font-style:italic}
.c-hl{background:rgba(240,179,90,.14)}
.cur{display:inline-block;width:1ch;height:1.08em;vertical-align:-.17em;background:var(--am);animation:blink 1.06s steps(1) infinite}
.typing .cur{animation:none}
@keyframes blink{50%{opacity:0}}

/* 桌面字幕条 */
.cap{position:absolute;left:90px;right:90px;top:1022px;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--cap);letter-spacing:.04em}
.cap b{font-weight:500;color:#4D4A44}
#capT{position:absolute;left:50%;translate:-50% 0;white-space:nowrap}
#capT.hint{color:#9A958C}

/* 结尾：退出终端 */
.byeL{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;opacity:0;pointer-events:none;transition:opacity .9s .5s}
.byeL h1{font:900 168px/1 "Noto Sans SC",sans-serif;color:var(--ink);letter-spacing:.02em}
.byeL h2{margin-top:26px;font:400 34px/1 var(--mono);color:#5B5850;letter-spacing:.02em}
.byeL p{margin-top:56px;display:flex;gap:44px;font:500 22px/1 var(--mono);color:#6E6A62}
.byeL p span b{color:var(--ink)}
.byeL .qa{margin-top:70px;padding:12px 22px;border:1.5px solid #8F8A80;border-radius:8px;font:500 18px/1 var(--mono);color:#6E6A62;letter-spacing:.2em}
.stage.bye .win{opacity:0;scale:.94;filter:blur(6px)}
.stage.bye .byeL{opacity:1}
.stage.bye .cap{opacity:.0;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){.win,.byeL{transition:none}.cur{animation:none}}
</style>
</head>

let cur=-1,token=0,busy=false,liveId=0,byeT=0;
class Cancel extends Error{}
const sleep=(ms,my)=>new Promise((res,rej)=>setTimeout(()=>my===token?res():rej(new Cancel()),ms));
const addLine=html=>{const el=d.createElement('div');el.className='ln';el.innerHTML=html;scr.appendChild(el);return el};
const curH='<span class="cur"></span>';
const head=P=>[[...[[P.t,'c-cm']]],[...prompt,[P.cmd,'b']]];
let base=0; // 输出区第一行在 scr 中的序号
function api(my){return{
  sleep:ms=>sleep(ms,my),
  set:(i,segs)=>{const el=scr.children[base+i];if(el)el.innerHTML=lineH(segs)},
  add:segs=>{const tail=scr.lastElementChild;scr.insertBefore(Object.assign(d.createElement('div'),{className:'ln',innerHTML:lineH(segs)}),tail)},
  setAll:lines=>{const tail=scr.lastElementChild;lines.forEach((l,i)=>{let el=scr.children[base+i];if(!el||el===tail){el=d.createElement('div');el.className='ln';scr.insertBefore(el,tail)}el.innerHTML=lineH(l)})}}}
function finalRender(i){
  const P=PAGES[i];scr.innerHTML='';scr.classList.remove('typing','fade-out');
  head(P).forEach(l=>addLine(lineH(l)));base=2;
  const lines=P.out();lines.forEach(l=>addLine(lineH(l)));

  ttl.textContent='zsh — kestrel — 96×22';

}
async function play(i,my){
  const P=PAGES[i];busy=true;
  scr.classList.add('fade-out');await sleep(170,my);scr.classList.remove('fade-out');
  scr.innerHTML='';scr.classList.add('typing');
  // 注释行（标题）快速打出
  let el=addLine(curH);const type=async(segs,sp)=>{for(const[t,c]of segs){const span=d.createElement('span');span.className=c||'';el.insertBefore(span,el.lastChild);
      for(const ch of t){span.insertAdjacentHTML('beforeend',chH(ch));await sleep(sp*(.55+Math.random()*.9)+(ch===' '&&Math.random()<.25?sp*2:0),my)}}};
  await type([[P.t,'c-cm']],16);el.lastChild.remove();
  el=addLine(lineH(prompt)+curH);await sleep(260,my);
  ttl.textContent=P.cmd.split(' ')[0]+' — kestrel — 96×22';
  await type([[P.cmd,'b']],52);await sleep(320,my);
  el.lastChild.remove();scr.classList.remove('typing');base=2;
  const lines=P.init?P.init():P.out();
  for(const l of lines){addLine(lineH(l));await sleep(34,my)}
  addLine(lineH(prompt)+curH);const tail=scr.lastElementChild;tail.style.visibility='hidden';
  if(P.anim)await P.anim(api(my));
  if(P.bye){tail.remove();await sleep(650,my);stage.classList.add('bye')}
  else tail.style.visibility='';
  ttl.textContent='zsh — kestrel — 96×22';
  if(P.live)liveId=P.live(api(my));
  busy=false;
}
function go(i,instant){
  i=Math.max(0,Math.min(N-1,i));
  const back=i<cur;cur=i;const my=++token;busy=false;clearInterval(liveId);
  stage.classList.remove('bye');scr.classList.remove('typing','fade-out');
  capN.textContent=String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
  capT.classList.remove('hint');capT.textContent=PAGES[i].cap;
  history.replaceState(null,'','#'+(i+1));
  if(instant||back||RM)finalRender(i);
  else play(i,my).catch(e=>{if(!(e instanceof Cancel))throw e});
}
const next=()=>{if(busy){token++;busy=false;clearInterval(liveId);finalRender(cur)}else if(cur<N-1)go(cur+1)};
const prev=()=>go(cur-1);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();prev()}
  else if(k==='Home')go(0,true);else if(k==='End')go(N-1,true);
  else if(k==='f'||k==='F'){d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen?.()}});
stage.addEventListener('click',e=>{const r=stage.getBoundingClientRect();(e.clientX-r.left)<r.width*.2?prev():next()});
let tx=null,ty=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2)dx<0?next():prev()},{passive:true});
const fit=()=>stage.style.setProperty('--s',Math.min(innerWidth/1920,innerHeight/1080));
addEventListener('resize',fit);fit();
const fromHash=()=>{const n=parseInt(location.hash.slice(1),10);return isNaN(n)?0:n-1};
addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)go(i,true)});
Promise.race([d.fonts?d.fonts.ready:0,new Promise(r=>setTimeout(r,1200))]).then(()=>{
  const i=fromHash();go(i,i!==0);
  if(cur===0){capT.classList.add('hint');capT.textContent='→ 执行下一条命令 · 动画中再按 → 立即完成 · F 全屏';setTimeout(()=>{if(cur===0){capT.classList.remove('hint');capT.textContent=PAGES[0].cap}},6500)}});
window.deck={go:i=>go(i-1),jump:i=>go(i-1,true),n:N};
})();
</script>

<script>

<script>
