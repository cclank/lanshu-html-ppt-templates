body.tk-editing [data-tk-ed]:focus{outline:2px solid #0A84FF;outline-offset:3px}
body.tk-editing [data-tk-dirty]:not(:focus){outline:2px dotted rgba(52,199,89,.9);outline-offset:3px}

body.tk-editing.idle [data-tk-ed]{cursor:text!important}

@media print{#tk-ink,#tk-laser,#tk-blank,#tk-bar,#tk-jump,#tk-toast,#tk-help,#tk-rm,#tk-ov,#tk-ed-bar,#tk-ed-panel,#tk-ed-pick,.tk-hk{display:none!important}body.tk-editing [data-tk-ed]{outline:none!important}}
</style>
<script>
(()=>{
const d=document,Q=location.search;
/* 总览缩略图实例：入场画完后停掉逐帧绘制，十几个实例同时存在也不耗电。
   至少等 2.6 秒且画满 150 帧，机器慢、帧率低时会自动多等一会儿 */
if(/[?&]tk-thumb/.test(Q)){const raf=window.requestAnimationFrame.bind(window),t0=performance.now();let f=0;
  const tick=()=>{if(++f<150||performance.now()-t0<2600)return raf(tick);
    window.requestAnimationFrame=()=>0;d.querySelectorAll('video,audio').forEach(v=>v.pause())};raf(tick)}
/* 演讲者窗口、总览和手机里的预览实例不加载工具包 */
if(/[?&]presenter-preview/.test(Q))return;
const b=d.body;
const mk=(tag,id,cls)=>{const e=d.createElement(tag);if(id)e.id=id;if(cls)e.className=cls;b.appendChild(e);return e};
const swallow=e=>e.stopPropagation();
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){}};
const dpr=()=>Math.min(2,devicePixelRatio||1);
const page=()=>{const n=parseInt(location.hash.slice(1),10);return isNaN(n)?1:n};
const total=()=>(window.deck&&window.deck.n)||d.querySelectorAll('.slide').length||0;
const goTo=n=>{if(window.deck&&window.deck.go)window.deck.go(n);else location.hash='#'+n};
/* 版心：与各套的 1920×1080 舞台一致，批注按版心坐标保存，窗口缩放后仍对得上 */
const box=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);return{s,x:(innerWidth-1920*s)/2,y:(innerHeight-1080*s)/2}};
let ovOn=false;
const overview=()=>ovOn||b.classList.contains('is-overview');

/* ── 讲稿与页标题（总览和手机遥控用）── */
let NOTES=null;
const notes=()=>{if(!NOTES){try{NOTES=JSON.parse(d.getElementById('deck-notes').textContent)}catch(e){NOTES=[]}}return NOTES};
function titles(){const sl=[...d.querySelectorAll('.slide')];
  return Array.from({length:total()},(_,i)=>{const h=sl[i]&&sl[i].querySelector('h1,h2,h3');let t=h?h.textContent.replace(/\s+/g,' ').trim():'';
    if(!t)t=(notes()[i]||'').replace(/【[^】]*】/g,'').split(/[。！？；!?;]/).map(s=>s.trim()).find(s=>s.length>=8)||'';
    return t.length>28?t.slice(0,27)+'…':t})}

/* ── 提示条：在各套原有提示后面补一句 ── */
const hintEl=d.querySelector('.ui-hint,#hint,.h-hint');
const deckHint=hintEl?hintEl.textContent.replace(/\s+/g,' ').trim():'';
if(hintEl){const s=d.createElement('span');s.className='tk-hk';s.style.fontFamily='system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';s.textContent=' · ? 快捷键';hintEl.appendChild(s)}
const nativeO=/(^|·)\s*O\s/.test(deckHint);

/* ── 小提示 ── */
const toastEl=mk('div','tk-toast','tk-ui');let toastT;
function toast(msg,ms=1800){toastEl.textContent=msg;toastEl.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>toastEl.style.display='none',ms)}

/* ── 画布 ── */
const ink=mk('canvas','tk-ink'),ix=ink.getContext('2d');
const las=mk('canvas','tk-laser'),lx=las.getContext('2d');
function size(){const r=dpr();for(const c of [ink,las]){c.width=Math.round(innerWidth*r);c.height=Math.round(innerHeight*r);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}redraw();drawLaser()}

/* ── 画笔批注：每页各自保存，翻回来还在；刷新页面后清空 ── */
const COLORS=[['#FF3B30','红'],['#FFCC00','黄'],['#0A84FF','蓝'],['#34C759','绿'],['#FFFFFF','白'],['#111111','黑']];
const strokes=new Map();
let drawOn=false,color=COLORS[0][0],cur=null,rcur=null,dirty=0;
const list=()=>{const k=page();if(!strokes.has(k))strokes.set(k,[]);return strokes.get(k)};
function path(st){const p=st.pts;ix.strokeStyle=st.c;ix.lineWidth=st.w;ix.beginPath();ix.moveTo(p[0][0],p[0][1]);
  if(p.length<3)ix.lineTo(p[p.length-1][0]+.01,p[p.length-1][1]);
  else{for(let i=1;i<p.length-1;i++)ix.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);ix.lineTo(p[p.length-1][0],p[p.length-1][1])}
  ix.stroke()}
function redraw(){dirty=0;const r=dpr(),{s,x,y}=box();ix.setTransform(1,0,0,1,0,0);ix.clearRect(0,0,ink.width,ink.height);
  if(overview())return;ix.setTransform(r*s,0,0,r*s,r*x,r*y);ix.lineCap=ix.lineJoin='round';
  for(const st of strokes.get(page())||[])path(st)}
const later=()=>{if(!dirty)dirty=requestAnimationFrame(redraw)};
const pos=e=>{const{s,x,y}=box();return[(e.clientX-x)/s,(e.clientY-y)/s]};
const pen=c=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><circle cx='12' cy='12' r='7' fill='rgba(0,0,0,.35)'/><circle cx='12' cy='12' r='5' fill='${c}' stroke='#fff' stroke-width='1.5'/></svg>`)}") 12 12, crosshair`;
ink.addEventListener('pointerdown',e=>{if(!drawOn||e.button>0)return;e.preventDefault();e.stopPropagation();ink.setPointerCapture(e.pointerId);cur={c:color,w:6,pts:[pos(e)]};list().push(cur);later()});
ink.addEventListener('pointermove',e=>{if(!cur)return;for(const c of e.getCoalescedEvents?e.getCoalescedEvents():[e])cur.pts.push(pos(c));later()});
for(const t of ['pointerup','pointercancel'])ink.addEventListener(t,()=>{cur=null});
for(const t of ['click','dblclick','mousedown','mouseup','touchstart','touchmove','touchend','contextmenu'])ink.addEventListener(t,swallow);

const bar=mk('div','tk-bar','tk-ui');
bar.innerHTML=COLORS.map(([c,n])=>`<button class="sw" data-c="${c}" style="background:${c}" title="${n}色" aria-label="${n}色"></button>`).join('')+
  '<i></i><button class="t" data-a="undo">撤销</button><button class="t" data-a="clear">清空本页</button><button class="t done" data-a="done">完成</button>';
for(const t of ['click','pointerdown','mousedown','touchstart','touchend','dblclick'])bar.addEventListener(t,swallow);
bar.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.c)setColor(t.dataset.c);else if(t.dataset.a==='undo')undo();else if(t.dataset.a==='clear')clearPage();else setDraw(false)});
function setColor(c){color=c;bar.querySelectorAll('.sw').forEach(s=>s.classList.toggle('sel',s.dataset.c===c));ink.style.cursor=pen(c)}
function setDraw(on){if(on===drawOn)return;drawOn=on;if(on)setLaser(false);ink.classList.toggle('on',on);bar.classList.toggle('on',on);
  if(on){setColor(color);toast('画笔：按住鼠标书写 · C 清除本页 · 再按 D 退出')}else{ink.style.cursor='';cur=null}}
function undo(){const l=strokes.get(page());if(!l||!l.length)return false;l.pop();later();return true}
function clearPage(){const l=strokes.get(page());if(!l||!l.length)return false;l.length=0;later();toast('已清除本页批注');return true}

/* ── 激光笔：鼠标或手机遥控 ── */
let laserOn=false,remoteOn=false,trail=[],last=null,lraf=0,rlT;
addEventListener('pointermove',e=>{if(!laserOn)return;last=[e.clientX,e.clientY];trail.push([e.clientX,e.clientY,performance.now()]);if(!lraf)lraf=requestAnimationFrame(drawLaser)},{passive:true,capture:true});
function drawLaser(){lraf=0;const r=dpr(),now=performance.now();lx.setTransform(1,0,0,1,0,0);lx.clearRect(0,0,las.width,las.height);
  if(!(laserOn||remoteOn)||!last)return;lx.setTransform(r,0,0,r,0,0);
  trail=trail.filter(p=>now-p[2]<240);lx.lineCap='round';
  for(let i=1;i<trail.length;i++){const a=trail[i-1],c=trail[i],k=1-(now-c[2])/240;lx.strokeStyle=`rgba(255,45,45,${(.5*k).toFixed(3)})`;lx.lineWidth=2+9*k;lx.beginPath();lx.moveTo(a[0],a[1]);lx.lineTo(c[0],c[1]);lx.stroke()}
  const[x,y]=last,g=lx.createRadialGradient(x,y,0,x,y,24);
  g.addColorStop(0,'rgba(255,70,70,.95)');g.addColorStop(.3,'rgba(255,30,30,.5)');g.addColorStop(1,'rgba(255,0,0,0)');
  lx.fillStyle=g;lx.beginPath();lx.arc(x,y,24,0,7);lx.fill();
  lx.fillStyle='#FF2D2D';lx.beginPath();lx.arc(x,y,6,0,7);lx.fill();
  lx.fillStyle='rgba(255,255,255,.9)';lx.beginPath();lx.arc(x,y,2.4,0,7);lx.fill();
  if(trail.length)lraf=requestAnimationFrame(drawLaser)}
function setLaser(on){if(on===laserOn)return;laserOn=on;if(on)setDraw(false);b.classList.toggle('tk-laser',on);if(!on&&!remoteOn){trail=[];last=null}drawLaser();
  if(on)toast('激光笔 · 再按 L 关闭')}

/* ── 黑屏 / 白屏 ── */
const blank=mk('div','tk-blank');let blankMode='';
const setBlank=m=>{blankMode=m;blank.className=m};
blank.addEventListener('click',e=>{e.stopPropagation();setBlank('')});
for(const t of ['pointerdown','mousedown','touchstart','touchend','dblclick'])blank.addEventListener(t,swallow);

/* ── 输入页码跳转 ── */
const jumpEl=mk('div','tk-jump','tk-ui');let buf='',jumpT;
function showJump(){clearTimeout(jumpT);if(!buf){jumpEl.style.display='none';return}
  const n=total(),over=n&&+buf>n;
  jumpEl.innerHTML=`跳到第<b>${buf}</b>页<span>${over?'共 '+n+' 页':'Enter 确认 · Esc 取消'}</span>`;jumpEl.style.display='block';
  jumpT=setTimeout(()=>{buf='';showJump()},4000)}

/* ── 总览：自带总览的套用自己的，其余几套用缩略预览拼一张 ── */
const ov=mk('div','tk-ov','tk-ui');let ovSel=0,ovBuilt=false;
const cells=()=>[...ov.querySelectorAll('.c')];
function buildOv(){ovBuilt=true;const n=total(),T=titles(),base=location.href.split('#')[0].split('?')[0];
  ov.innerHTML=`<div class="hd"><b>总览</b><span>共 ${n} 页 · 点击或用方向键选择，Enter 打开 · Esc 关闭</span></div><div class="g">${
    T.map((t,i)=>`<button class="c" data-i="${i+1}"><div class="f"><span class="ph">${pad(i+1)}</span></div><div class="t"><b>${pad(i+1)}</b>${esc(t)}</div></button>`).join('')}</div>`;
  const fs=[...ov.querySelectorAll('.f')];let k=0;
  const next=()=>{if(k>=fs.length)return;const i=k++,f=d.createElement('iframe');f.tabIndex=-1;f.setAttribute('aria-hidden','true');
    f.onload=()=>setTimeout(next,200);f.src=base+'?presenter-preview&tk-thumb#'+(i+1);fs[i].appendChild(f)};
  next()}

    if(tg.hasAttribute('data-to')){const v=parseFloat(m.now.replace(/[^\d.\-]/g,''));if(!isNaN(v))tg.setAttribute('data-to',String(v))}}
  const nj=doc.getElementById('deck-notes');if(nj)nj.textContent='[\n'+notes().map(s=>JSON.stringify(s)).join(',\n')+'\n]';
  doc.title=d.title;
  for(const[v,h]of Object.entries(edVars)){const re=new RegExp('('+v.replace(/[.*+?^${}()|[\]\\-]/g,'\\$&')+'\\s*:\\s*)([^;}]+)');
    for(const st of doc.querySelectorAll('style')){if(/^(embedded-fonts|tk-style)$/.test(st.id)||!re.test(st.textContent))continue;st.textContent=st.textContent.replace(re,'$1'+h);break}}
  const name=fileName().replace(/(（已编辑）)?\.html?$/i,'')+'（已编辑）.html',link=d.createElement('a');
  link.href=URL.createObjectURL(new Blob(['<!doctype html>\n'+doc.documentElement.outerHTML+'\n'],{type:'text/html;charset=utf-8'}));
  link.download=name;link.id='tk-download';b.appendChild(link);link.click();setTimeout(()=>{URL.revokeObjectURL(link.href);link.remove()},4000);
  const notes2=[];if(lost.length)notes2.push(`有 ${lost.length} 处脚本生成的文字没能保存：${lost.join('、')}，请改用全套替换`);
  for(const[f,n]of skipped)notes2.push(`「${f}」在脚本生成的内容里还有 ${n} 处没替换（为避免改坏代码），需要的话请在源码里替换`);
  edDirty=false;toast(`已另存为「${name}」`+(notes2.length?'。'+notes2.join('；'):''),notes2.length?9000:3000)}

/* ── 快捷键面板 ── */
const help=mk('div','tk-help','tk-ui');let helpOn=false;
const extra=deckHint.split('·').map(s=>s.trim()).filter(s=>s&&!/^(← →|F |O |S |⌘|\?)/.test(s));
const K=(...ks)=>ks.map(k=>`<kbd>${k}</kbd>`).join('');
const rows=[
  ['翻页',K('←','→')+'<em>或 空格 · PageUp / PageDown · 翻页笔</em>'],
  ['跳到某页',K('3')+K('Enter')+'<em>输入页码后回车</em>'],
  ['第一页 / 最后一页',K('Home')+K('End')],
  ['总览',K('O')],
  ['全屏',K('F')+'<em>翻页笔的放映键也可以</em>'],
  ['演讲者视图',K('S')+'<em>另开窗口：备注 · 下一页 · 计时</em>'],
  ['黑屏 / 白屏',K('B')+K('W')+'<em>再按一下恢复</em>'],
  ['激光笔',K('L')],
  ['画笔批注',K('D')+'<em>开关</em>'+K('C')+'<em>清除本页</em>'+K('Ctrl')+K('Z')+'<em>撤销</em>'],
  ['手机遥控',K('M')+'<em>手机扫码：翻页 · 讲稿 · 激光笔 · 画笔</em>'],
  ['编辑与换色',K('E')+'<em>直接改文字和讲稿 · 全套替换 · 换主题色，另存为新文件</em>'],
  ['导出 PDF',K('⌘ / Ctrl')+K('P')],
];
help.innerHTML=`<div class="p"><h3>放映快捷键</h3><dl>${rows.map(([a,c])=>`<dt>${a}</dt><dd>${c}</dd>`).join('')}</dl>`+
  (extra.length?`<p class="x">本套还可以：<b>${extra.join('　·　')}</b></p>`:'')+`<p class="x" style="border:0;padding:0;margin-top:12px">按任意键或点击关闭</p></div>`;
const setHelp=on=>{helpOn=on;help.classList.toggle('on',on)};
help.addEventListener('click',e=>{e.stopPropagation();setHelp(false)});
for(const t of ['pointerdown','mousedown','touchstart','touchend','dblclick','wheel'])help.addEventListener(t,swallow,{passive:true});

/* ── 按键：捕获阶段处理，先于各套自己的翻页逻辑 ── */
addEventListener('keydown',e=>{
  const t=e.target,k=e.key,stop=()=>{e.preventDefault();e.stopImmediatePropagation()};
  if(edOn&&(e.ctrlKey||e.metaKey)&&!e.altKey&&(k==='s'||k==='S')){stop();edSave();return}
  if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))){
    /* 改文字、填面板时按键只给输入框，不让各套拿去翻页 */
    if(edOn||(t.closest&&t.closest('[id^="tk-"]'))){if(k==='Escape'&&t.blur)t.blur();e.stopImmediatePropagation()}return}
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(k==='z'||k==='Z')){if(undo())stop();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(edOn){if(k==='e'||k==='E'||k==='Escape'){stop();setEd(false)}else if(/^[oObBwWlLdDmMcC?0-9]$/.test(k))stop();return}
  if(k==='F5'){stop();if(!d.fullscreenElement)d.documentElement.requestFullscreen?.()?.catch(()=>{});return}
  if(blankMode){if(k==='Shift')return;stop();if(e.repeat)return;
    if(k==='b'||k==='B'||k==='.')setBlank(blankMode==='b'?'':'b');else if(k==='w'||k==='W'||k===',')setBlank(blankMode==='w'?'':'w');else setBlank('');return}
  if(helpOn||rmOn){if(k!=='Shift'){stop();setHelp(false);setRm(false)}return}
  if(ovOn){if(k!=='Shift'){stop();ovKey(k)}return}
  if(buf){
    if(/^[0-9]$/.test(k)){stop();buf=(buf+k).slice(0,3);showJump();return}
    if(k==='Enter'){stop();const n=total(),v=n?Math.min(n,+buf):+buf;buf='';showJump();if(v>=1)goTo(v);return}
    if(k==='Backspace'){stop();buf=buf.slice(0,-1);showJump();return}
    if(k==='Escape'){stop();buf='';showJump();return}
    buf='';showJump();
  }
  if(/^[1-9]$/.test(k)){stop();buf=k;showJump();return}
  if(e.repeat&&/^[bBwW.,lLdDmM?]$/.test(k)){stop();return}
  switch(k){
    case 'b':case 'B':case '.':stop();setBlank('b');return;
    case 'w':case 'W':case ',':stop();setBlank('w');return;
    case 'l':case 'L':stop();setLaser(!laserOn);return;
    case 'd':case 'D':stop();setDraw(!drawOn);return;
    case 'c':case 'C':if(clearPage())stop();return;
    case 'm':case 'M':stop();setRm(true);return;
    case 'e':case 'E':stop();setEd(true);return;
    case 'o':case 'O':if(!nativeO){stop();setOv(true)}return;
    case '?':stop();setHelp(true);return;
    case 'Escape':if(overview())return;if(drawOn){stop();setDraw(false)}else if(laserOn){stop();setLaser(false)}return;
  }
},true);

/* 翻页、进出总览时换上对应页的批注；已配对时把页码同步给手机 */
let state='',sent='';
setInterval(()=>{if(drawOn&&overview())setDraw(false);const s=page()+'|'+overview();if(s!==state){state=s;cur=null;rcur=null;redraw();if(edOn){edPg();if(edPanel==='text')fillText()}}
  const r=page()+'|'+blankMode;if(rc&&r!==sent){sent=r;pushState(false)}},200);
addEventListener('resize',size);size();
window.deckToolkit={laser:setLaser,draw:setDraw,blank:setBlank,help:setHelp,overview:setOv,remote:setRm,edit:setEd,save:edSave,clear:clearPage};
})();
</script>
